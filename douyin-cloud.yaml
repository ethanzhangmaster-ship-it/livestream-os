apiVersion: v1
kind: Service
metadata:
  name: livestream-os
  labels:
    app: livestream-os
spec:
  ports:
  - port: 3000
    name: callback
    protocol: TCP
    targetPort: 3000
  - port: 8080
    name: dashboard
    protocol: TCP
    targetPort: 8080
  selector:
    app: livestream-os
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livestream-os
  labels:
    app: livestream-os
spec:
  replicas: 1
  selector:
    matchLabels:
      app: livestream-os
  template:
    metadata:
      labels:
        app: livestream-os
    spec:
      containers:
      - name: livestream-os
        image: livestream-os:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: callback
        - containerPort: 8080
          name: dashboard
        env:
        - name: NODE_ENV
          value: production
        - name: OBS_HOST
          valueFrom:
            configMapKeyRef:
              name: livestream-os-config
              key: obs-host
        - name: OBS_PORT
          valueFrom:
            configMapKeyRef:
              name: livestream-os-config
              key: obs-port
        - name: OBS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: livestream-os-secret
              key: obs-password
        - name: DOUYIN_API_KEY
          valueFrom:
            secretKeyRef:
              name: livestream-os-secret
              key: douyin-api-key
        - name: DOUYIN_API_SECRET
          valueFrom:
            secretKeyRef:
              name: livestream-os-secret
              key: douyin-api-secret
        - name: DOUYIN_ROOM_ID
          valueFrom:
            configMapKeyRef:
              name: livestream-os-config
              key: douyin-room-id
        - name: USE_FAKE_DATA
          value: "false"
        - name: DASHBOARD_PORT
          value: "8080"
        - name: LOG_LEVEL
          value: "info"
        resources:
          limits:
            cpu: "2"
            memory: "2Gi"
          requests:
            cpu: "1"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: data
          mountPath: /app/data
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: livestream-os-config
data:
  obs-host: "your-local-ip"
  obs-port: "4455"
  douyin-room-id: "your-room-id"
---
apiVersion: v1
kind: Secret
metadata:
  name: livestream-os-secret
type: Opaque
stringData:
  obs-password: "your-obs-password"
  douyin-api-key: "aww36rpeq413jv0c"
  douyin-api-secret: "c45716df69c2ed1e7a2093ee2ced4bf8"
