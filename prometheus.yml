global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Livestream OS 应用
  - job_name: 'livestream-os'
    static_configs:
      - targets: ['livestream-os:8080']
    metrics_path: '/api/metrics'

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  # Prometheus 自身
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
